# Reverse proxy in front of the SvelteKit (adapter-node) app.
server_tokens off;

upstream pms_app {
    server app:3000;
    keepalive 32;
}

# Brute-force guard for credential POSTs only (GET /login is not limited).
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key    zone=login:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    proxy_read_timeout 60s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;

    # Content-hashed build assets: cache forever.
    location /_app/immutable/ {
        proxy_pass http://pms_app;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://pms_app;
    }

    # Booking engine, OTA webhook, iCal feeds.
    location /api/public/ {
        limit_req zone=public burst=40 nodelay;
        proxy_pass http://pms_app;
    }

    # Liveness for orchestration; not logged.
    location = /healthz {
        access_log off;
        proxy_pass http://pms_app;
    }

    location / {
        proxy_pass http://pms_app;
    }
}
